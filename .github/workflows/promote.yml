# Promote main to the Fly production app (pay2own.fly.dev).
#
# Actions → Promote to production → Run workflow → Branch: main.
# A push to main does not deploy. Production changes only when this workflow succeeds.
#
# Requires FLY_API_TOKEN on the production environment:
#   fly tokens create deploy -a pay2own -n github-promote -x 8760h

name: Promote to production

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  promote:
    name: Deploy main to Fly
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pay2own.fly.dev
    steps:
      - name: Deploy only from main
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Promote deploys main only. Re-run the workflow and select the main branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app pay2own --ha=false

      - name: Check production health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://pay2own.fly.dev/health
