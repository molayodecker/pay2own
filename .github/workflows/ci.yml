name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay2own
          POSTGRES_PASSWORD: pay2own
          POSTGRES_DB: pay2own_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pay2own"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://pay2own:pay2own@localhost:5432/pay2own_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.30.1

      - name: Run migrations
        run: goose -dir migrations postgres "$TEST_DATABASE_URL" up

      - name: Seed test data
        run: |
          psql "$TEST_DATABASE_URL" <<'SQL'
          INSERT INTO customers (id, full_name, phone) VALUES (1, 'Test Customer', '+233000000001');
          INSERT INTO devices (id, customer_id, imei, model) VALUES (1, 1, '000000000000001', 'BLU G33');
          INSERT INTO loans (id, device_id, principal_minor, deposit_minor) VALUES (1, 1, 150000, 30000);
          INSERT INTO installments (loan_id, sequence, due_date, amount_minor) VALUES
            (1, 1, '2026-11-20', 30000), (1, 2, '2026-11-27', 30000),
            (1, 3, '2026-12-04', 30000), (1, 4, '2026-12-11', 30000);
          SQL

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...