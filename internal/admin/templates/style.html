{{define "style"}}
<link rel="icon" href="/admin/static/favicon.png" sizes="any">
<link rel="icon" href="/admin/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/admin/static/apple-touch-icon.png">
<meta name="theme-color" content="#0d1859">
<style>
  :root {
    color-scheme: light;
    --ink: #0d1859;
    --sky: #2caadf;
    --gold: #f9d523;
    --ivory: #eef7fc;
    --card: #ffffff;
    --line: rgba(13, 24, 89, 0.1);
    --muted: #4a5283;
    --danger-bg: #f6e4df;
    --danger: #8a3126;
    --ok-bg: #e5f2ea;
    --ok: #1d6842;
    --wait-bg: #fff6d4;
    --wait: #8a6a08;
    --sans: ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15.5px/1.5 var(--sans); background: var(--ivory); color: var(--ink); }
  a { color: inherit; }
  .app { min-height: 100vh; display: grid; grid-template-columns: 15.5rem 1fr; }
  .rail {
    background: var(--ink); color: #fff;
    padding: 1.6rem 1.15rem; display: flex; flex-direction: column; gap: 1.75rem;
  }
  .brand { color: inherit; text-decoration: none; }
  .brand img { display: block; height: 2.35rem; width: auto; }
  .brand span { display: block; margin-top: 0.45rem; font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sky); }
  .rail nav { display: flex; flex-direction: column; gap: 0.25rem; }
  .rail nav a { text-decoration: none; padding: 0.55rem 0.7rem; border-radius: 10px; color: #fff; }
  .rail nav a:hover { background: rgba(255, 255, 255, 0.08); }
  .rail form { margin-top: auto; }
  button.quiet {
    width: 100%; margin: 0; padding: 0.55rem 0.7rem; text-align: left;
    background: transparent; color: rgba(255, 255, 255, 0.72); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px; font: inherit; cursor: pointer;
  }
  button.quiet:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
  .canvas { padding: 2.4rem 2.2rem 3.5rem; max-width: 62rem; }
  h1 { margin: 0; font-weight: 720; font-size: 2.4rem; letter-spacing: -0.04em; line-height: 1.05; }
  h2 { margin: 0 0 0.85rem; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 680; }
  .lede { margin: 0.7rem 0 1.6rem; color: var(--muted); max-width: 36rem; }
  .calc { min-height: 1.4rem; margin: -0.15rem 0 0.95rem; color: var(--sky); font-weight: 650; }
  .layout { display: grid; gap: 1rem; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 1.35rem 1.35rem 1.45rem; }
  .steps { margin-top: 1rem; display: grid; gap: 1rem; }
  form p, .field { margin: 0 0 0.9rem; }
  label { display: block; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 680; }
  input, select {
    width: 100%; margin-top: 0.35rem; padding: 0.78rem 0.8rem;
    font: 1rem/1.3 var(--sans); color: var(--ink); background: #f4fafd;
    border: 1px solid transparent; border-radius: 12px;
  }
  input:focus, select:focus { outline: 2px solid var(--sky); background: #fff; }
  input.invalid, select.invalid {
    outline: 2px solid var(--danger);
    outline-offset: 3px;
    background: #fff;
    box-shadow: 0 0 0 6px rgba(138, 49, 38, 0.16);
  }
  input.invalid:focus, select.invalid:focus { outline: 2px solid var(--danger); }
  .toast {
    position: fixed; z-index: 20; left: 50%; bottom: 1.25rem;
    transform: translateX(-50%); margin: 0;
    max-width: min(28rem, calc(100% - 2rem));
    padding: 0.75rem 1.05rem; border-radius: 999px;
    background: var(--danger); color: #fff; font-weight: 650;
    box-shadow: 0 10px 30px rgba(20, 19, 17, 0.18);
  }
  .toast[hidden] { display: none; }
  .grid { display: grid; gap: 0.9rem; }
  button, .button {
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 0.4rem; padding: 0.8rem 1.15rem; font: inherit; font-weight: 650;
    color: #fff; background: var(--ink); border: 0; border-radius: 12px;
    text-decoration: none; cursor: pointer;
  }
  button:hover, .button:hover { background: #16307a; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 1.15rem; }
  .actions form { margin: 0; }
  .error { margin: 0 0 1rem; padding: 0.8rem 0.95rem; background: var(--danger-bg); color: var(--danger); border-radius: 12px; }
  .token { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.92rem; word-break: break-all; background: #f4fafd; padding: 0.9rem 1rem; border-radius: 12px; }
  .facts { display: grid; grid-template-columns: 8.5rem 1fr; gap: 0.7rem 1rem; margin: 0; }
  .facts dt { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 0.15rem; }
  .facts dd { margin: 0; font-weight: 600; }
  .step .kicker { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 720; color: var(--sky); }
  .qr { display: grid; place-items: center; margin-top: 0.4rem; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 1rem; }
  .qr img { width: min(100%, 240px); height: auto; }
  .pill { display: inline-block; padding: 0.22rem 0.65rem; border-radius: 999px; background: #e7eef8; font-size: 0.78rem; font-weight: 680; letter-spacing: 0.04em; }
  .pill.on { background: var(--ok-bg); color: var(--ok); }
  .pill.wait { background: var(--wait-bg); color: var(--wait); }
  .pill.off { background: #eceae6; color: var(--muted); }
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--ink); color: #fff; }
  .gate main { width: min(100%, 26rem); background: var(--card); color: var(--ink); }
  .gate .brand img { height: 2.8rem; }
  .gate h1 { font-size: 2.6rem; margin-top: 1.4rem; }
  .gate .lede { color: var(--muted); }
  @media (min-width: 761px) {
    .rail { position: sticky; top: 0; height: 100vh; }
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 1.65fr 0.85fr; align-items: start; }
    .grid.two { grid-template-columns: 1fr 1fr; }
    .steps { grid-template-columns: 1fr 1fr; align-items: start; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .rail { padding: 1rem 1rem 0.8rem; gap: 0.8rem; }
    .rail nav { flex-direction: row; align-items: center; }
    .rail form { margin-top: 0; }
    button.quiet { width: auto; }
    .canvas { padding: 1.4rem 1rem 2.5rem; }
    h1 { font-size: 2.2rem; }
  }
</style>
{{end}}

{{define "bar"}}
<aside class="rail">
  <a class="brand" href="/admin"><img src="/admin/static/logo-dark.png" alt="Pay2Own"><span>Shop</span></a>
  <nav>
    <a href="/admin">New sale</a>
  </nav>
  <form method="post" action="/admin/logout">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button class="quiet" type="submit">Sign out</button>
  </form>
</aside>
{{end}}
